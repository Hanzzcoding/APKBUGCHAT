<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0713">
<meta name="description" content="Zixziro - kumpulan tools, chat, shop, dan utilitas.">
<title>Zixziro</title>
<style>
:root{--bg:#0b0713;--card:#15101f;--card2:#1b1528;--line:#2b2142;--accent:#8b5cf6;--accent2:#a855f7;--text:#fff;--muted:#a79bbd;--green:#22c55e;--red:#ef4444;--top:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.hidden{display:none!important}
svg.ic{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a{color:inherit}
.btn{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px}
.btn.primary{background:linear-gradient(110deg,var(--accent),var(--accent2));border-color:transparent;font-weight:800;box-shadow:0 6px 18px rgba(139,92,246,.25)}
.btn.ghost{background:transparent}
.btn.danger{color:#fca5a5}
.btn.full{width:100%}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:11px}
.btn:disabled{opacity:.5}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:13px;color:#fff;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.28);outline:none}
.field textarea{min-height:90px;resize:vertical}
select option{background:#1b1528;color:#fff}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.eyebrow{color:var(--accent2);font-size:11px;letter-spacing:2px;font-weight:900;margin:18px 4px 8px}
h1{font-size:22px;margin:6px 0}
h2{font-size:15px;margin:0 0 10px}
p{margin:6px 0}

/* login */
#authPage{position:relative;min-height:100vh}
#backgroundImage{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:var(--bg)}
.shade{position:fixed;inset:0;background:rgba(8,3,16,.62);z-index:1}
.authWrap{position:relative;z-index:2;width:min(100%,520px);margin:auto;padding:14px 12px 40px}
.glass{background:rgba(21,16,31,.68);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbarA{display:flex;align-items:center;justify-content:space-between;padding:12px;margin-bottom:12px}
.brandA{font-weight:900;letter-spacing:1.5px}
.brandA small{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}
.mading{position:relative;height:170px;overflow:hidden;border-radius:20px;border:1px solid var(--line);margin-bottom:8px;background:#000}
.mading video{display:block;width:100%;height:100%;object-fit:cover}
.liveTag{position:absolute;top:10px;left:10px;padding:6px 10px;border-radius:9px;background:rgba(0,0,0,.6);font-size:10px;font-weight:900}
.powered{text-align:center;color:#c4b5fd;font-size:10px;letter-spacing:1.2px;font-weight:800;margin:10px 0 14px}
.authCard{padding:18px}
.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.pwWrap{position:relative}.pwWrap input{padding-right:46px}
.eyeBtn{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:36px;height:36px;padding:0;display:grid;place-items:center;background:transparent;border:0;color:#c4b5fd}
.eyeBtn svg{width:20px;height:20px}

/* shell */
#shell{min-height:100vh}
.header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,560px);height:var(--top);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(11,7,19,.92);backdrop-filter:blur(10px)}
.header .title{font-weight:800;font-size:17px;position:absolute;left:50%;transform:translateX(-50%)}
.iconBtn{position:relative;width:40px;height:40px;display:grid;place-items:center;background:transparent;border:0;border-radius:12px}
.iconBtn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
#page{width:min(100%,560px);margin:auto;padding:calc(var(--top) + 8px) 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:#d9d0ea;background:rgba(255,255,255,.03)}
.pill.green{border-color:#166534;color:#86efac;background:rgba(34,197,94,.08)}
.pill.purple{border-color:#5b3fb0;color:#c4b5fd}
.pill .d{width:7px;height:7px;border-radius:50%;background:#777}
.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;overflow:hidden;border:2px solid #b24ad8;background:#1b1528}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:36px;height:36px;flex-basis:36px;border-width:1px}
.banner{position:relative;height:190px;overflow:hidden;border-radius:22px;border:1px solid var(--line);margin-bottom:12px;background:#000}
.banner video,.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .bt{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;text-shadow:0 2px 8px #000;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);padding:30px 0 0}
.banner .bt b{font-size:19px;display:block}.banner .bt span{font-size:12px;opacity:.9}.banner .bt .clk{font-weight:800;font-size:15px}
.badge{font-size:10px;font-weight:900;padding:6px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;width:70px;text-align:center;font-size:11px;background:none;border:0;padding:0}
.st .ring{width:66px;height:66px;border-radius:50%;padding:3px;border:2px solid #22c55e;margin:0 auto 6px;position:relative}
.st .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.st .plus{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:15px;border:2px solid var(--bg)}
.st span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listRow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-weight:700;font-size:15px}
.listRow .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(139,92,246,.14);color:#c4b5fd}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{padding:14px;border-radius:16px;border:1px solid #3b3b7a;background:#18203b;text-align:left;min-height:84px}
.tile.pink{border-color:#7a3b52;background:#2c1620}
.tile b{display:block;margin-top:8px}.tile small{color:var(--muted);font-size:11px}
.marq{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:#1a1330;color:#c4b5fd;font-weight:900;letter-spacing:1.5px;font-size:13px;margin-bottom:12px}
.stat{padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.stat small{color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;margin-top:6px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,330px);z-index:31;background:#0d0817;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
.dHead{padding:calc(24px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line)}
.dHead h2{font-size:24px;margin:0 0 12px}
.dScroll{flex:1;overflow-y:auto;padding:6px 10px 10px}
.dSec{color:var(--muted);font-size:13px;letter-spacing:1px;font-weight:700;margin:18px 10px 6px}
.dItem{display:flex;align-items:center;gap:16px;width:100%;padding:13px 12px;border:0;border-radius:14px;background:none;text-align:left;font-size:17px;font-weight:700;color:#f1ecfb}
.dItem.active{background:#1c1233;color:#fff}.dItem.active svg.chev{color:#a78bfa}
.dItem small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.dItem.locked{opacity:.55}
.dItem .lk{margin-left:auto}
.dItem .chev{margin-left:auto}
.dFoot{text-align:center;color:var(--muted);font-size:13px;padding:12px 0 calc(14px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#1d4ed8;display:grid;place-items:center;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.5);border:0}

/* tools */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-size:12px}
.chip.active{background:linear-gradient(110deg,var(--accent),var(--accent2));border-color:transparent;font-weight:800}
.toolGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{position:relative;min-width:0;min-height:92px;padding:12px 4px 8px;border:1px solid var(--line);border-radius:15px;background:var(--card2);text-align:center;font-size:11px;line-height:1.3;overflow-wrap:anywhere}
.tool .emoji{display:block;font-size:22px;margin-bottom:6px}
.tool .tag{position:absolute;top:5px;right:5px;font-size:8px;padding:2px 5px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.4)}
.tool.locked{opacity:.65}
.search{width:100%;padding:13px;color:#fff;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.28);outline:none;margin-bottom:10px}
.meter{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

/* plans/shop */
.plan{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px}
.plan.current{border-color:var(--green)}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.7}
.price{font-weight:900;color:#86efac}.old{text-decoration:line-through;color:var(--muted);font-weight:500;margin-right:6px;font-size:12px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.msg{display:flex;gap:8px;align-items:flex-end}.msg.me{flex-direction:row-reverse}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me .bub{background:#32215f;border-color:#4b34a0}
.bub small{display:block;color:#c4b5fd;font-size:10px;font-weight:800;margin-bottom:3px}
.bub time{display:block;color:var(--muted);font-size:9px;margin-top:3px;text-align:right}
.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0}

/* music */
.disc{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;background:conic-gradient(#8b5cf6,#ec4899,#22d3ee,#8b5cf6);display:grid;place-items:center;box-shadow:0 0 34px rgba(139,92,246,.45)}
.disc.spin{animation:spin 6s linear infinite}.disc i{width:46px;height:46px;border-radius:50%;background:var(--bg);display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrls{display:flex;justify-content:center;align-items:center;gap:18px;margin:10px 0}
.ctrl{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center}
.ctrl.big{width:62px;height:62px;background:linear-gradient(110deg,var(--accent),var(--accent2));border:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.trk{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);margin-top:8px;text-align:left;font-weight:700}
.trk.on{border-color:var(--accent);background:#1e1538}

.notice{padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.2);color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-size:12px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:300px;overflow:auto}
table.tb{width:100%;border-collapse:collapse;font-size:12px}table.tb td,table.tb th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere;vertical-align:top}
.codeBox{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;font-weight:800;color:#c4b5fd}

/* overlays */
.toast{position:fixed;z-index:90;bottom:90px;left:50%;transform:translateX(-50%);background:#241a3a;border:1px solid var(--accent);border-radius:12px;padding:11px 14px;display:none;max-width:92%;font-size:13px;text-align:center}.toast.show{display:block}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,0,12,.75);display:flex;align-items:flex-end;justify-content:center}
.sheetBox{width:min(100%,560px);max-height:92vh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#150f21;border:1px solid var(--line)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheetHead h2{margin:0;font-size:17px}
.closeBtn{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(8,3,16,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;backdrop-filter:blur(6px)}
.orb{position:relative;width:150px;height:150px;perspective:700px;margin:0 auto 18px}
.orbCore{position:absolute;inset:34px;border-radius:50%;background:conic-gradient(#ff2d55,#ffb300,#35e06f,#22c8ff,#7a5cff,#ff2dd1,#ff2d55);animation:spin 1.4s linear infinite;box-shadow:0 0 34px rgba(160,100,255,.6)}
.orbCore::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 45%)}
.ring3{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.r1{animation:ringA 2.4s linear infinite}.r2{animation:ringB 3s linear infinite;border-color:rgba(255,120,200,.7)}.r3{animation:ringC 3.6s linear infinite;border-color:rgba(120,200,255,.7);inset:0}
@keyframes ringA{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes ringB{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(-360deg)}}
@keyframes ringC{from{transform:rotateX(40deg) rotateY(40deg) rotateZ(0)}to{transform:rotateX(40deg) rotateY(40deg) rotateZ(360deg)}}
.ovTitle{font-weight:900;font-size:18px}
.ovTarget{margin-top:14px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);max-width:340px;width:100%}
.ovTarget small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px;letter-spacing:1px}
.doneMark{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#2fe27a,#149e52);display:grid;place-items:center;margin:27px auto 18px;box-shadow:0 0 32px rgba(47,226,122,.55);animation:pop .45s ease-out}.doneMark svg{width:52px;height:52px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
#intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
#intro video{width:100%;height:100%;object-fit:cover}
#skipIntro{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);font-weight:800;font-size:13px;color:#fff;z-index:2}
#introTap{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:2}
#storyView{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#storyView .sbody{font-size:24px;font-weight:800;overflow-wrap:anywhere;max-width:100%;white-space:pre-wrap}
#storyView img{max-width:100%;max-height:70vh;border-radius:14px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.orbCore,.ring3,.disc.spin{animation-duration:8s!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="authPage">
  <img id="backgroundImage" src="https://files.catbox.moe/odhwwm.jpg" alt="" aria-hidden="true">
  <div class="shade"></div>
  <div class="authWrap">
    <header class="topbarA glass">
      <div class="brandA">ZIXZIRO<small>DIGITAL SYSTEM</small></div>
      <button class="btn sm" id="musicButtonA" type="button" aria-label="Putar atau jeda musik">♫</button>
    </header>
    <div class="mading">
      <video id="madingVideo" autoplay muted playsinline loop preload="metadata"><source src="https://files.catbox.moe/df9tiu.mp4" type="video/mp4"></video>
      <div class="liveTag">● MADING</div>
    </div>
    <div class="powered">POWERED BY ZIXZIRO × HANZZY CODING</div>
    <section class="glass authCard">
      <div class="eyebrow" style="margin:0" id="authEyebrow">SECURE ACCESS</div>
      <h1 id="authTitle">Welcome back.</h1>
      <p class="muted" id="authDescription">Masuk ke akun kamu.</p>
      <div class="authTabs">
        <button class="btn primary" id="showLogin" type="button">Login</button>
        <button class="btn" id="showRegister" type="button">Buat akun</button>
      </div>
      <form id="authForm">
        <div class="field"><label for="authUsername">Username</label>
          <input id="authUsername" maxlength="32" autocomplete="username" required placeholder="Masukkan username"></div>
        <div class="field"><label for="authPassword">Password</label>
          <div class="pwWrap"><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required placeholder="Masukkan password">
          <button class="eyeBtn" id="togglePassword" type="button" aria-label="Tampilkan password" aria-pressed="false"></button></div></div>
        <button class="btn primary full" id="authSubmit" type="submit">Masuk</button>
      </form>
      <a class="btn primary full" style="margin-top:12px" href="https://whatsapp.com/channel/0029Vb93mhbDOQIOVA69r03r" target="_blank" rel="noopener noreferrer">Follow saluran WhatsApp</a>
    </section>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="shell" class="hidden">
  <header class="header">
    <button class="iconBtn" id="menuBtn" type="button" aria-label="Buka menu"></button>
    <div class="title" id="pageTitle">Home</div>
    <div class="row" style="gap:0">
      <button class="iconBtn" id="profileBtn" type="button" aria-label="Profil"></button>
      <button class="iconBtn" id="bellBtn" type="button" aria-label="Pengumuman"></button>
    </div>
  </header>
  <main id="page"></main>
  <button class="fab" id="fabSupport" type="button" aria-label="Bantuan admin"></button>
  <div class="scrim" id="scrim"></div>
  <aside id="drawer" aria-label="Menu utama"></aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="playlistAudio" preload="metadata"></audio>

<!-- Tool sheet -->
<div class="sheet hidden" id="toolSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheetBox">
    <div class="sheetHead"><h2 id="sheetTitle">Fitur</h2><button class="closeBtn" id="sheetClose" type="button" aria-label="Tutup">✕</button></div>
    <p class="muted" id="sheetDesc"></p>
    <div id="toolForm"></div>
    <button class="btn primary full" id="toolRun" type="button">Jalankan</button>
    <div id="toolResultWrap" class="hidden" style="margin-top:12px"><pre class="out" id="toolResult"></pre>
      <button class="btn full" id="toolCopy" type="button" style="margin-top:8px">Salin hasil</button></div>

const CATS = ['Semua', ...new Set(TOOLS.map(t => t.cat))];

const canUse = t => t.access !== 'pro' || planOf(currentUser).pro;
const toolBtn = t => { const tag = t.access === 'quota' ? 'KUOTA' : t.access === 'pro' ? (canUse(t) ? 'PRO' : '🔒 PRO') : ''; return '<button class="tool' + (canUse(t) ? '' : ' locked') + '" data-tool="' + t.id + '" type="button">' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '<span class="emoji">' + esc(t.icon) + '</span>' + esc(t.name) + '</button>'; };

/* sheet alat */
function openTool(id) {
  const t = TOOLS.find(x => x.id === id); if (!t) return;
  if (!canUse(t)) { toast('Fitur PRO — upgrade ke Premium untuk membuka.'); go('shop'); return; }
  activeTool = t; $('sheetTitle').textContent = t.icon + '  ' + t.name;
  $('sheetDesc').textContent = t.desc + (t.access === 'quota' ? ' Memakai 1 kuota harian.' : t.access === 'pro' ? ' Fitur PRO, memakai 1 kuota harian.' : ' Gratis tanpa batas.');
  $('toolForm').innerHTML = t.fields.map(f => {
    const idc = 'f_' + f.id; let c;
    if (f.type === 'select') c = '<select id="' + idc + '">' + f.options.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('') + '</select>';
    else if (f.type === 'textarea') c = '<textarea id="' + idc + '" placeholder="' + esc(f.placeholder || '') + '"></textarea>';
    else c = '<input id="' + idc + '" type="' + (f.type || 'text') + '" ' + (f.type === 'number' ? 'inputmode="decimal" step="any" ' : '') + 'value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '" autocomplete="off">';
    return '<div class="field"><label for="' + idc + '">' + esc(f.label) + '</label>' + c + '</div>';
  }).join('');
  $('toolResultWrap').classList.add('hidden'); $('toolSheet').classList.remove('hidden');
}
const closeTool = () => { $('toolSheet').classList.add('hidden'); activeTool = null; };
$('sheetClose').addEventListener('click', closeTool);
$('toolSheet').addEventListener('click', e => { if (e.target === $('toolSheet')) closeTool(); });
async function showOrb(summary) {
  $('ovTargetText').textContent = summary || '-'; $('orbStage').classList.remove('hidden'); $('doneStage').classList.add('hidden'); $('orbOverlay').classList.remove('hidden');
  await sleep(3000); $('orbStage').classList.add('hidden'); $('doneStage').classList.remove('hidden'); await sleep(1100); $('orbOverlay').classList.add('hidden');
}
$('toolRun').addEventListener('click', async () => {
  const t = activeTool; if (!t || running) return;
  const v = {}; t.fields.forEach(f => v[f.id] = $('f_' + f.id).value);
  const counts = t.access !== 'free';
  if (counts && usageOf(currentUser) >= limitOf(currentUser)) { toast('Kuota hari ini habis. Upgrade paket untuk menambah kuota.'); closeTool(); go('shop'); return; }
  running = true; $('toolRun').disabled = true;
  try {
    let out; try { out = await t.run(v); } catch (err) { toast(err.message || 'Input tidak valid.'); return; }
    if (counts) { let s = String(t.summary ? t.summary(v) : ''); if (s.length > 60) s = s.slice(0,57) + '…'; await showOrb(s); addUsage(currentUser); }
    $('toolResult').textContent = out; $('toolResultWrap').classList.remove('hidden'); record('Memakai fitur: ' + t.name);
    if (cur === 'home') render();
  } finally { running = false; $('toolRun').disabled = false; }
});
$('toolCopy').addEventListener('click', () => copyText($('toolResult').textContent).then(() => toast('Hasil disalin.')));

let stBg = '#7c3aed';
function showStory(id) {
  const s = storiesActive().find(x => String(x.id) === String(id)); if (!s) return;
  const v = $('storyView'); v.style.background = s.kind === 'img' ? '#000' : s.bg;
  v.innerHTML = '<div class="row" style="position:absolute;top:16px;left:16px;right:16px"><div class="avatar sm"><img src="' + esc(avatarOf(s.u)) + '" alt=""></div><b class="sp" style="text-align:left">' + esc(s.u) + '</b><button class="closeBtn" type="button" data-act="storyClose">✕</button></div>' + (s.kind === 'img' ? '<img src="' + esc(s.img) + '" alt="Status">' : '<div class="sbody">' + esc(s.text) + '</div>');
  v.classList.remove('hidden');
}
function redeemCode(src) {
  const el = $(src), code = (el.value || '').trim().toUpperCase(); if (!code) return toast('Masukkan kode dulu.');
  const codes = arr(KEYS.codes), c = codes.find(x => x.code === code);
  if (!c) return toast('Kode tidak ditemukan.');
  if (c.usedBy) return toast('Kode sudah dipakai.');
  c.usedBy = currentUser; c.usedAt = Date.now(); if (!writeJSON(KEYS.codes, codes)) return;
  if (c.kind === 'saldo') addBalance(currentUser, Number(c.value), 'Redeem kode ' + code); else { applyPlan(currentUser, c.value); }
  record('Redeem kode ' + code); el.value = ''; toast('Berhasil! ' + codeLabel(c) + ' ditambahkan.'); render();
}
function dlKind(u) { const m = u.split('?')[0].toLowerCase(); return /\.(png|jpe?g|gif|webp|bmp|svg)$/.test(m) ? 'img' : /\.(mp3|m4a|wav|ogg|aac|flac)$/.test(m) ? 'audio' : /\.(mp4|webm|mov|mkv)$/.test(m) ? 'video' : 'file'; }
function validUrl() { const u = ($('dlUrl').value || '').trim(); try { const x = new URL(u); if (!/^https?:$/.test(x.protocol)) throw 0; return x.href; } catch { toast('Masukkan link http(s) yang valid.'); return null; } }

const ACTIONS = {
  go: el => go(el.dataset.go),
  cat: el => { activeCat = el.dataset.cat; render(); },
  daily: () => {
    const d = me().daily || {}; if (d.last === todayKey()) return toast('Kamu sudah absen hari ini.');
    const streak = d.last === yesterdayKey() ? (d.streak % 7) + 1 : 1;
    patchUser(currentUser, a => { a.daily = { last:todayKey(), streak }; a.bonus = { date:todayKey(), count:bonusOf(currentUser) + 1 }; });
    record('Daily login hari ke-' + streak); toast('Absen berhasil! +1 kuota hari ini (hari ' + streak + '/7).'); render();
  },
  redeem: el => redeemCode(el.dataset.src),
  buy: el => {
    const id = el.dataset.plan, price = Number(el.dataset.price);
    if (balanceOf(currentUser) < price) { toast('Saldo kurang. Top up dulu di Wallet.'); return go('wallet'); }
    if (!confirm('Beli ' + PLANS[id].name + ' seharga ' + rp(price) + ' dari saldo?')) return;
    addBalance(currentUser, -price, 'Beli ' + PLANS[id].name); applyPlan(currentUser, id); record('Membeli ' + PLANS[id].name); toast('Paket ' + PLANS[id].name + ' aktif!'); render();
  },
  resGen: () => {
    const id = $('rsPlan').value, qty = Math.max(1, Math.min(10, parseInt($('rsQty').value) || 1)), unit = Math.round(PLANS[id].num * RESELLER_RATE), total = unit * qty;
    if (balanceOf(currentUser) < total) return toast('Saldo kurang. Butuh ' + rp(total) + '.');
    if (!confirm('Beli ' + qty + ' kode ' + PLANS[id].name + ' seharga ' + rp(total) + '?')) return;
    const codes = arr(KEYS.codes), made = []; for (let i = 0; i < qty; i++) { const c = { code:genCode(), kind:'plan', value:id, by:currentUser, t:Date.now() }; codes.push(c); made.push(c.code); }
    if (!writeJSON(KEYS.codes, codes)) return; addBalance(currentUser, -total, 'Beli ' + qty + ' kode ' + PLANS[id].name); record('Beli ' + qty + ' kode ' + PLANS[id].name);
    $('rsOut').innerHTML = '<pre class="out" style="margin-top:12px">' + esc(made.join('\n')) + '</pre><button class="btn full" style="margin-top:8px" type="button" data-act="copyOut" data-text="' + esc(made.join('\n')) + '">Salin semua kode</button>'; toast('Kode berhasil dibuat.');
  },
  genCodes: () => {
    const kind = $('gcKind').value, qty = Math.max(1, Math.min(20, parseInt($('gcQty').value) || 1)), amt = parseInt($('gcAmt').value) || 0;
    if (kind === 'saldo' && amt <= 0) return toast('Isi nominal saldo.');
    const codes = arr(KEYS.codes), made = []; for (let i = 0; i < qty; i++) { const c = { code:genCode(), kind:kind === 'saldo' ? 'saldo' : 'plan', value:kind === 'saldo' ? amt : kind, by:currentUser, t:Date.now() }; codes.push(c); made.push(c.code); }
    if (!writeJSON(KEYS.codes, codes)) return; record('Membuat ' + qty + ' kode');
    $('gcOut').innerHTML = '<pre class="out" style="margin-top:12px">' + esc(made.join('\n')) + '</pre><button class="btn full" style="margin-top:8px" type="button" data-act="copyOut" data-text="' + esc(made.join('\n')) + '">Salin semua kode</button>'; toast('Kode dibuat.');
  },
  copyOut: el => copyText(el.dataset.text).then(() => toast('Disalin.')),
  donPick: el => { $('donAmt').value = el.dataset.amt; },
  donate: () => { const a = parseInt($('donAmt').value) || 0; if (a < 1000) return toast('Minimal donasi Rp1.000.'); window.open(waLink('Halo admin Zixziro, saya mau donasi ' + rp(a) + '. ' + ($('donMsg').value.trim() ? 'Pesan: ' + $('donMsg').value.trim() + '. ' : '') + 'Username: ' + currentUser), '_blank', 'noopener'); record('Donasi ' + rp(a)); },
  chatSend: () => { const t = $('chatIn').value.trim(); if (!t) return; const l = arr(KEYS.chat); l.push({ u:currentUser, text:t.slice(0, 300), t:Date.now() }); writeJSON(KEYS.chat, l.slice(-200)); render(); const i = $('chatIn'); if (i) i.focus(); },
  chatClear: () => { if (confirm('Hapus semua pesan Global Chat?')) { writeJSON(KEYS.chat, []); render(); } },
  dmOpen: el => { dmWith = el.dataset.u; render(); },
  dmBack: () => { dmWith = null; render(); },
  dmSend: () => { const t = $('dmIn').value.trim(); if (!t || !dmWith) return; const l = arr(KEYS.dm); l.push({ f:currentUser, to:dmWith, text:t.slice(0, 300), ts:Date.now() }); writeJSON(KEYS.dm, l.slice(-500)); render(); },
  stBg: el => { stBg = el.dataset.c; document.querySelectorAll('.stbg').forEach(b => b.style.outline = b === el ? '2px solid #fff' : 'none'); },
  storyPost: async () => {
    const text = $('stText').value.trim(), f = $('stImg').files && $('stImg').files[0], list = arr(KEYS.story);
    if (!text && !f) return toast('Isi teks atau pilih gambar.');
    const push = s => { list.push({ id:Date.now(), u:currentUser, t:Date.now(), ...s }); if (writeJSON(KEYS.story, list.slice(-60))) { record('Posting story'); toast('Status diposting.'); render(); } };
    if (f) { if (!f.type.startsWith('image/')) return toast('Pilih file gambar.'); if (f.size > 700 * 1024) return toast('Gambar maksimal 700 KB.'); const r = new FileReader(); r.onload = () => push({ kind:'img', img:r.result, text }); r.readAsDataURL(f); }
    else push({ kind:'text', text, bg:stBg });
  },
  storyView: el => showStory(el.dataset.id),
  storyClose: () => $('storyView').classList.add('hidden'),
  storyDel: el => { writeJSON(KEYS.story, arr(KEYS.story).filter(s => String(s.id) !== el.dataset.id)); render(); },
  mToggle: () => toggleMusic(),
  mNext: () => playTrack(songIndex + 1), mPrev: () => playTrack(songIndex - 1), mPlay: el => playTrack(+el.dataset.i),
  dlPrev: () => {
    const u = validUrl(); if (!u) return; const k = dlKind(u), o = $('dlOut');
    o.innerHTML = k === 'img' ? '<img src="' + esc(u) + '" alt="Pratinjau" style="max-width:100%;border-radius:12px">' : k === 'audio' ? '<audio controls src="' + esc(u) + '" style="width:100%"></audio>' : k === 'video' ? '<video controls playsinline src="' + esc(u) + '" style="width:100%;border-radius:12px"></video>' : '<div class="notice" style="margin:0">Jenis file tidak bisa dipratinjau. Gunakan tombol Unduh.</div>';
  },
  dlGet: async () => {
    const u = validUrl(); if (!u) return; toast('Mengunduh…');
    try { const r = await fetch(u); if (!r.ok) throw 0; const b = await r.blob(), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = decodeURIComponent(u.split('?')[0].split('/').pop() || 'file'); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); record('Unduh media'); toast('Unduhan dimulai.'); }
    catch { window.open(u, '_blank', 'noopener'); toast('Server memblokir unduhan langsung, file dibuka di tab baru.'); }
  },
  saveName: () => { const n = $('displayName').value.trim() || currentUser; patchUser(currentUser, a => { a.displayName = n; }); record('Nama tampilan diperbarui'); toast('Tersimpan.'); render(); },
  clearHist: () => { if (confirm('Hapus semua riwayat?')) { writeJSON(KEYS.history + currentUser, []); render(); } },
  delAcc: () => {
    if (SEED[currentUser]) return toast('Akun Owner/Admin tidak bisa dihapus.');
    if (!confirm('Hapus akun dan data lokal? Tindakan ini tidak bisa dibatalkan.')) return;
    const u = currentUser, users = getUsers(); delete users[u]; if (!saveUsers(users)) return;
    [KEYS.history, KEYS.avatar, KEYS.notes].forEach(k => localStorage.removeItem(k + u)); localStorage.removeItem(KEYS.session);
    toAuth(); $('authUsername').value = ''; setAuthMode('register'); toast('Akun dan data lokal dihapus.');
  },
  adGrant: () => { const n = $('adUser').value, id = $('adPlan').value; if (isStaff(n)) return toast('Owner/Admin sudah unlimited.'); applyPlan(n, id); record('Paket ' + PLANS[id].name + ' untuk ' + n); toast('Paket diaktifkan.'); render(); },
  adRevoke: () => { patchUser($('adUser').value, a => { delete a.plan; }); toast('Paket dicabut.'); render(); },
  adRole: () => { const n = $('adUser').value, r = $('adRole').value; if (SEED[n]) return toast('Role akun ini tidak bisa diubah.'); patchUser(n, a => { a.role = r; }); toast('Role diubah.'); render(); },
  adBal: () => { const n = $('adUser').value, a = parseInt($('adBal').value) || 0; if (!a) return toast('Isi nominal.'); addBalance(n, a, 'Penyesuaian admin (' + currentUser + ')'); record('Saldo ' + n + ' ' + (a > 0 ? '+' : '') + a); toast('Saldo diperbarui.'); render(); },
  adReset: () => { patchUser($('adUser').value, a => { a.usage = { date:todayKey(), count:0 }; }); toast('Kuota di-reset.'); render(); },
  anPost: () => { const t = $('anT').value.trim(), b = $('anB').value.trim(); if (!t || !b) return toast('Isi judul dan isi.'); const l = arr(KEYS.ann); l.push({ id:Date.now(), title:t, text:b, t:Date.now(), by:currentUser }); writeJSON(KEYS.ann, l.slice(-30)); toast('Pengumuman terkirim.'); render(); },
  anDel: el => { writeJSON(KEYS.ann, arr(KEYS.ann).filter(a => String(a.id) !== el.dataset.id)); render(); }
};

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tool]'); if (tb) return openTool(tb.dataset.tool);
  const g = e.target.closest('[data-go]'); if (g && !g.dataset.act) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a, e);
});
document.addEventListener('input', e => { if (e.target.id === 'toolSearch') { const v = e.target.value, p = e.target.selectionStart; render(); const s = $('toolSearch'); if (s) { s.focus(); s.setSelectionRange(p, p); } } if (e.target.id === 'seek' && audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; });
document.addEventListener('keydown', e => { if (e.key === 'Enter') { if (e.target.id === 'chatIn') ACTIONS.chatSend(); if (e.target.id === 'dmIn') ACTIONS.dmSend(); } });
document.addEventListener('change', e => {
  if (e.target.id !== 'uploadAvatar') return; const f = e.target.files && e.target.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { toast('Pilih file gambar.'); e.target.value = ''; return; }
  if (f.size > 2 * 1024 * 1024) { toast('Ukuran gambar maksimal 2 MB.'); e.target.value = ''; return; }
  const r = new FileReader(); r.onload = () => { try { localStorage.setItem(KEYS.avatar + currentUser, r.result); toast('Foto profil tersimpan.'); render(); } catch { toast('Foto terlalu besar untuk penyimpanan browser.'); } }; r.readAsDataURL(f);
});
window.addEventListener('storage', () => { if (currentUser && (cur === 'chat' || cur === 'messages')) render(); });

/* ================= boot ================= */
function armFirstGestureMusic() {
  const evs = ['pointerdown', 'touchstart', 'keydown'];
  const start = e => { if (e && e.target && e.target.closest && e.target.closest('#musicButtonA,[data-m=toggle],#skipIntro,#introTap')) return; if (!$('intro').classList.contains('hidden')) return; evs.forEach(ev => document.removeEventListener(ev, start, true)); tryStartMusic(); };
  evs.forEach(ev => document.addEventListener(ev, start, true));
}
const mv = $('madingVideo'); mv.muted = true; mv.loop = true; mv.playsInline = true; mv.play().catch(() => {});
seedAccounts(); setAuthMode('login');
const sess = readJSON(KEYS.session, null);
if (sess && sess.username && getUsers()[sess.username]) enterApp(sess.username); else { tryStartMusic(); armFirstGestureMusic(); }
})();
</script>
</body>
